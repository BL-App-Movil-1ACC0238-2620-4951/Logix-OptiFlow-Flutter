name: logix_optiflow
description: Cliente Flutter de Logix OptiFlow — citas, ópticas, receta y operación clínica.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  get_it: ^9.3.0
  flutter_secure_storage: ^11.2.0
  lucide_icons_flutter: ^4.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  mobile_scanner: ^7.5.0
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/geist.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_medium.ttf
          weight: 500
        - asset: assets/fonts/poppins_semibold.ttf
          weight: 600
        - asset: assets/fonts/poppins_bold.ttf
          weight: 700
